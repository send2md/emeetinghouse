{% extends "base.html" %}
{% block title %}Set up your login — Emeetinghouse{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:2rem auto;">
  <h1>Welcome, {{ participant.name }}</h1>
  <p class="muted">Choose a username and password for your account. Nobody else,
    including the administrator, will see the password you pick.</p>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" required autofocus>
    <label>Password (at least 8 characters)</label>
    <input type="password" name="password" required minlength="8">
    <p><input type="submit" value="Set up my login"></p>
  </form>
</div>
{% endblock %}
