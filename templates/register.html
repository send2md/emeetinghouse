{% extends "base.html" %}
{% block title %}Register — Emeetinghouse{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto;">
  <h1>{{ username }} is your login. You are a new Participant.</h1>
  <form method="post" enctype="multipart/form-data">
    <label>Full name</label>
    <input type="text" name="name" required autofocus>

    <label>Temporary password (at least 8 characters)</label>
    <input type="password" name="password" required minlength="8">

    <p class="muted">A $1.00 registration fee normally applies here. Online payment
      isn't wired up yet, so nothing will be charged today.</p>

    <label>Address</label>
    <input type="text" name="address" required>

    <label>Mother's maiden name</label>
    <input type="text" name="mothers_maiden_name" required>

    <label>Age</label>
    <input type="number" name="age" min="0" required>

    <label>Thumbprint (a photo or scan of an inked thumbprint)</label>
    <input type="file" name="thumbprint" accept="image/png,image/jpeg" required>

    <label>Photo</label>
    <input type="file" name="photo" accept="image/png,image/jpeg" required>

    <p><input type="submit" value="Register"></p>
  </form>
</div>
{% endblock %}
